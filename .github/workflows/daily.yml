name: Daily AMIS Scrape & Deploy

on:
  schedule:
    - cron: '0 3 * * *'   # 3 AM UTC = 8 AM Pakistan time
  workflow_dispatch:        # allow manual run from GitHub UI

permissions:
  contents: write

jobs:
  scrape-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape latest prices (last 4 days)
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: node browseHistory.js --days=4 --prune=730
        continue-on-error: true

      - name: Generate planner HTML
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: node browseHistory.js --plan-only

      - name: Verify JS syntax (catch broken template before deploy)
        run: |
          node -e "
            const fs=require('fs');
            const html=fs.readFileSync('reports/planner.html','utf8');
            const s=html.slice(html.indexOf('<script>')+8,html.lastIndexOf('</script>'));
            fs.writeFileSync('/tmp/check.js',s);
          "
          node --check /tmp/check.js
          echo "✅ JS syntax OK"

      - name: Copy planner to docs/
        run: |
          mkdir -p docs
          cp reports/planner.html docs/index.html

      - name: Commit updated data & planner
        run: |
          git config user.name  "AMIS Bot"
          git config user.email "amis-bot@users.noreply.github.com"
          git add data/price-history.json data/arrival-history.json data/upload-times.json data/daily-changes.json docs/index.html docs/data/
          [ -f data/track-record.json ] && git add data/track-record.json || true
          git diff --staged --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
